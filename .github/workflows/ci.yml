# CI: a cada mudança proposta, confere estilo, testes e a imagem Docker. Falhou, a mudança fica bloqueada.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest

  docker:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t oraculo-mlops .
      - name: Rodar o pipeline de fumaça dentro da imagem
        run: docker run --rm oraculo-mlops --config configs/smoke.yaml
