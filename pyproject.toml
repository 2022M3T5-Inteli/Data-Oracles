[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oraculo"
version = "2.0.0"
description = "Previsão de audiência de TV 28 dias antes, com faixa de confiança e MLOps (dados sintéticos)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0,<2",
    "lightgbm>=4.3,<5",
    "matplotlib>=3.8,<4",
    "mlflow>=2.14,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pandera>=0.20,<1",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legado"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
