# Configuração de fumaça: o pipeline inteiro em segundos, para testes e CI.
# Só declara o que muda em relação ao arquivo herdado.
herda: config.yaml

caminhos:
  dados: data_smoke

dados:
  inicio: 2024-07-01
  publicos: [total_dom, feminino]

modelo:
  lgbm:
    n_estimators: 60
    num_leaves: 15
    min_child_samples: 20
  backtest:
    cortes: [2024-10-31, 2024-12-03]
  shap:
    amostra: 200

mlops:
  tracking_uri: sqlite:///mlflow_smoke.db
  pasta_artefatos: data_smoke/mlruns
  porta:
    melhoria_minima_vs_baseline: -10.0
    cobertura_min: 0.0
    tolerancia_vs_campeao: 10.0
